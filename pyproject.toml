[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofread-eng-scifi"
version = "0.1.0"
description = """
An artisanal language model for proofreading prose in the style of
classical English science fiction.
"""
authors = [
    {name = "Brandon Rohrer", email = "brohrer@gmail.com"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["proofread", "spell check", "text processing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "numpy>=2.4.4",
    "sentencepiece>=0.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
filterwarnings = [
    'ignore::DeprecationWarning'
]

[tool.ruff]
line-length = 80
